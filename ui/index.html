<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netsec-dojo</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
  --accent: #1f6feb; --accent-soft: #e7f0fe; --ok: #1a7f37; --ok-soft: #e6f4ea;
  --bad: #c4321c; --bad-soft: #fdecea; --code-bg: #f0f2f5;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --text: #e4e7eb; --muted: #949ca8; --line: #2a3039;
    --accent: #5a9cf8; --accent-soft: #17263b; --ok: #4cc06b; --ok-soft: #13291b;
    --bad: #f0785f; --bad-soft: #351a16; --code-bg: #0b0e12;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; overflow-y: auto; }
aside h1 { font-size: 18px; margin: 0 6px 2px; }
aside .sub { color: var(--muted); font-size: 13px; margin: 0 6px 16px; }
.overall { margin: 0 6px 18px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.module { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  margin: 18px 6px 6px; }
.labbtn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; color: inherit; padding: 8px 8px; border-radius: 6px;
  font: inherit; cursor: pointer; }
.labbtn:hover { background: var(--bg); }
.labbtn.sel { background: var(--accent-soft); }
.labbtn .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.labbtn .t { flex: 1; font-size: 14px; }
.labbtn .p { font-size: 12px; color: var(--muted); white-space: nowrap; }
.labbtn .p.full { color: var(--ok); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
main { padding: 28px 36px 60px; max-width: 980px; }
.banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; background: var(--bad-soft); color: var(--bad); }
.head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.head h2 { margin: 0 0 4px; font-size: 24px; }
.head .meta { color: var(--muted); font-size: 14px; }
.btn { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.small { font-size: 13px; padding: 4px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 22px 0 18px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px;
  font: inherit; color: var(--muted); cursor: pointer; }
.tab.sel { color: var(--text); border-bottom-color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
.card.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.task-h { display: flex; gap: 10px; align-items: baseline; }
.task-h h3 { margin: 0; font-size: 16px; flex: 1; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.task-body p { margin: 8px 0; }
input[type=text] { font: inherit; font-family: var(--mono); font-size: 14px; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; flex: 1; max-width: 340px; }
.msg { font-size: 14px; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.hints { margin-top: 10px; }
.hint { background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; margin-top: 6px; font-size: 14px; }
.hint p { margin: 0; }
.solution { margin-top: 10px; border-left: 3px solid var(--accent); padding-left: 12px; font-size: 14px; }
code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
pre code { background: none; padding: 0; }
.lesson { max-width: 760px; }
.lesson h1 { font-size: 22px; margin-top: 0; }
.lesson h2 { font-size: 18px; margin-top: 28px; }
.lesson table { border-collapse: collapse; margin: 10px 0; font-size: 14px; display: block; overflow-x: auto; }
.lesson th, .lesson td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.lesson th { background: var(--bg); }
blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 6px 6px 0; }
.nodes { display: grid; gap: 8px; }
.node { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center;
  padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.node b { font-family: var(--mono); }
.node .d { color: var(--muted); font-size: 14px; }
.node code { display: block; margin-top: 4px; font-size: 12px; word-break: break-all; }
.empty { color: var(--muted); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 20px 16px 50px; }
  .node { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>netsec-dojo</h1>
    <p class="sub">Networking and security labs on your machine</p>
    <div class="overall"><div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Progress</span><span id="overall-n"></span></div><div class="bar"><i id="overall-bar" style="width:0"></i></div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<script>
let state = null, selected = null, tab = "lesson";
const openHints = {}, msgs = {};
try { selected = localStorage.getItem("dojo.lab"); tab = localStorage.getItem("dojo.tab") || "lesson"; } catch (e) {}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json", "X-Dojo": "1"}, body: JSON.stringify(body)});
  return r.json();
}

async function refresh() {
  state = await api("/api/state");
  if (!state.labs.find(l => l.id === selected)) selected = state.labs[0] && state.labs[0].id;
  render();
}

function remember() {
  try { localStorage.setItem("dojo.lab", selected); localStorage.setItem("dojo.tab", tab); } catch (e) {}
}

function render() {
  const labs = state.labs;
  let total = 0, done = 0, html = "", mod = null;
  for (const l of labs) {
    const d = l.tasks.filter(t => t.done).length;
    total += l.tasks.length; done += d;
    if (l.module !== mod) { mod = l.module; html += `<div class="module">${esc(mod)}</div>`; }
    html += `<button class="labbtn ${l.id === selected ? "sel" : ""}" data-lab="${l.id}">
      <span class="num">${l.num}</span><span class="t">${esc(l.title)}</span>
      ${l.running ? '<span class="dot" title="running"></span>' : ""}
      <span class="p ${d === l.tasks.length ? "full" : ""}">${d}/${l.tasks.length}</span></button>`;
  }
  document.getElementById("nav").innerHTML = html;
  document.getElementById("overall-n").textContent = `${done} / ${total} tasks`;
  document.getElementById("overall-bar").style.width = (total ? 100 * done / total : 0) + "%";
  document.querySelectorAll(".labbtn").forEach(b => b.onclick = () => { selected = b.dataset.lab; remember(); render(); });
  renderLab(labs.find(l => l.id === selected));
}

function renderLab(l) {
  const main = document.getElementById("main");
  if (!l) { main.innerHTML = '<p class="empty">No labs found.</p>'; return; }
  const d = l.tasks.filter(t => t.done).length;
  let h = state.docker ? "" : '<div class="banner">Docker is not running. Start Docker Desktop, then reload this page.</div>';
  h += `<div class="head"><div><h2>${esc(l.title)}</h2>
    <div class="meta">Lab ${l.num} · about ${l.minutes} min · ${d}/${l.tasks.length} tasks done</div>
    <p style="margin:8px 0 0">${esc(l.summary)}</p></div>
    <div class="row">${l.running
      ? `<button class="btn" data-act="start">Reset lab</button><button class="btn" data-act="stop">Stop</button>`
      : `<button class="btn primary" data-act="start">Start lab</button>`}</div></div>
    <div id="lab-msg" class="msg" style="margin-top:8px">${msgs._lab || ""}</div>`;
  h += `<div class="tabs">${["lesson", "tasks", "hosts"].map(t =>
    `<button class="tab ${tab === t ? "sel" : ""}" data-tab="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>`;
  if (tab === "lesson") h += `<div class="lesson">${l.lesson}</div>`;
  if (tab === "hosts") {
    h += l.running ? "" : '<p class="empty">Start the lab to open shells on these hosts.</p>';
    h += `<div class="nodes">${l.nodes.map(n => `<div class="node"><b>${esc(n.name)}</b>
      <div><div class="d">${esc(n.desc)}</div><code>${esc(n.cmd)}</code></div>
      <button class="btn small" data-term="${esc(n.name)}" ${l.running ? "" : "disabled"}>Open terminal</button></div>`).join("")}</div>
      <p class="empty" style="font-size:13px">Or from a terminal in the project folder: <code>dojo shell ${l.num} &lt;host&gt;</code></p>`;
  }
  if (tab === "tasks") {
    if (!l.running) h += '<p class="empty">Start the lab first: most answers are generated fresh each time it starts.</p>';
    for (const t of l.tasks) {
      const key = l.id + "/" + t.id, m = msgs[key];
      h += `<div class="card ${t.done ? "done" : ""}"><div class="task-h"><h3>${esc(t.title)}</h3>
        <span class="badge">${t.type === "state" ? "hands-on" : "question"}</span>
        ${t.done ? '<span class="badge ok">done</span>' : ""}</div>
        <div class="task-body">${t.text}</div><div class="row">`;
      h += t.type === "answer"
        ? `<input type="text" placeholder="your answer" data-input="${t.id}" spellcheck="false"><button class="btn small" data-check="${t.id}">Submit</button>`
        : `<button class="btn small" data-check="${t.id}">Check</button>`;
      if (t.hints) h += `<button class="btn small" data-hint="${t.id}">${(openHints[key] || []).length ? "Next hint" : "Hint"}</button>`;
      if (t.has_solution) h += `<button class="btn small" data-sol="${t.id}">Show solution</button>`;
      h += `<span class="msg ${m ? (m.ok ? "ok" : "bad") : ""}">${m ? esc(m.text) : ""}</span></div>`;
      if ((openHints[key] || []).length) h += `<div class="hints">${openHints[key].map(x => `<div class="hint">${x}</div>`).join("")}</div>`;
      if (msgs["sol/" + key]) h += `<div class="solution">${msgs["sol/" + key]}</div>`;
      h += "</div>";
    }
  }
  main.innerHTML = h;
  main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; remember(); render(); });
  main.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    main.querySelectorAll("[data-act]").forEach(x => x.disabled = true);
    document.getElementById("lab-msg").textContent = act === "start" ? "Starting lab… (the first start can take a while)" : "Stopping…";
    const r = await api(`/api/lab/${l.id}/${act}`, {});
    msgs._lab = r.ok ? "" : esc(r.msg || "Something went wrong.");
    if (r.ok && act === "start") {
      for (const k of Object.keys(openHints)) if (k.startsWith(l.id + "/")) delete openHints[k];
      for (const k of Object.keys(msgs)) if (k.includes(l.id + "/")) delete msgs[k];
    }
    await refresh();
  });
  main.querySelectorAll("[data-term]").forEach(b => b.onclick = async () => {
    const r = await api(`/api/lab/${l.id}/terminal`, {node: b.dataset.term});
    if (!r.ok) { msgs._lab = esc(r.msg); render(); }
  });
  main.querySelectorAll("[data-input]").forEach(i => i.onkeydown = e => {
    if (e.key === "Enter") main.querySelector(`[data-check="${i.dataset.input}"]`).click(); });
  main.querySelectorAll("[data-check]").forEach(b => b.onclick = async () => {
    const id = b.dataset.check, input = main.querySelector(`[data-input="${id}"]`);
    b.disabled = true;
    const msgEl = b.parentElement.querySelector(".msg");
    msgEl.className = "msg"; msgEl.textContent = "Checking…";
    const r = await api(`/api/lab/${l.id}/check`, {task: id, value: input ? input.value : ""});
    msgs[l.id + "/" + id] = {ok: r.ok, text: r.msg || (r.ok ? "Correct." : "Not quite.")};
    await refresh();
  });
  main.querySelectorAll("[data-hint]").forEach(b => b.onclick = async () => {
    const key = l.id + "/" + b.dataset.hint;
    const r = await api(`/api/lab/${l.id}/hint`, {task: b.dataset.hint, n: (openHints[key] || []).length + 1});
    openHints[key] = r.hints;
    render();
  });
  main.querySelectorAll("[data-sol]").forEach(b => b.onclick = async () => {
    const key = l.id + "/" + b.dataset.sol;
    if (msgs["sol/" + key]) { delete msgs["sol/" + key]; return render(); }
    if (!confirm("Show the solution? Try the hints first: you learn far more by getting there yourself.")) return;
    const r = await api(`/api/lab/${l.id}/solution`, {task: b.dataset.sol});
    msgs["sol/" + key] = r.html;
    render();
  });
}

refresh().catch(() => { document.getElementById("main").innerHTML = '<div class="banner">Could not reach the dojo server. Is <code>dojo serve</code> running?</div>'; });
</script>
</body>
</html>
