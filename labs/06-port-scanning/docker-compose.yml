x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  scanner:
    <<: *node
    hostname: scanner
    networks: { office: { ipv4_address: 10.15.1.10 } }
  target:
    <<: *node
    hostname: target
    environment: { DOJO_PORT: "${DOJO_PORT}", DOJO_FLAG: "${DOJO_FLAG}" }
    networks: { office: { ipv4_address: "10.15.1.${DOJO_HOST}" } }
  printer:
    <<: *node
    hostname: printer
    networks: { office: { ipv4_address: "10.15.1.${DOJO_DECOY}" } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.15.1.0/24, gateway: 10.15.1.1 } ] }
