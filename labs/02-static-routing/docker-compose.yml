x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  client:
    <<: *node
    hostname: client
    networks: { lan: { ipv4_address: 10.12.1.10 } }
  router:
    <<: *node
    hostname: router
    sysctls: { net.ipv4.ip_forward: 1 }
    networks:
      lan: { ipv4_address: 10.12.1.254 }
      dmz: { ipv4_address: 10.12.2.254 }
  server:
    <<: *node
    hostname: server
    environment: { DOJO_FLAG: "${DOJO_FLAG}" }
    networks: { dmz: { ipv4_address: 10.12.2.10 } }

networks:
  lan:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.12.1.0/24, gateway: 10.12.1.1 } ] }
  dmz:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.12.2.0/24, gateway: 10.12.2.1 } ] }
