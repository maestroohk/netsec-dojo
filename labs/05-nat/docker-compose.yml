x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  laptop:
    <<: *node
    hostname: laptop
    networks: { home: { ipv4_address: 10.18.1.10 } }
  nas:
    <<: *node
    hostname: nas
    environment: { DOJO_FLAG: "${DOJO_FLAG}" }
    networks: { home: { ipv4_address: 10.18.1.20 } }
  router:
    <<: *node
    hostname: router
    sysctls: { net.ipv4.ip_forward: 1 }
    networks:
      home: { ipv4_address: 10.18.1.254 }
      internet: { ipv4_address: 203.0.113.1 }
  website:
    <<: *node
    hostname: website
    networks: { internet: { ipv4_address: 203.0.113.80 } }

networks:
  home:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.18.1.0/24, gateway: 10.18.1.1 } ] }
  internet:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 203.0.113.0/24, gateway: 203.0.113.254 } ] }
